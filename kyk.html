<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="出張報告">
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>危険予知活動表</title>
<style>
:root{--navy:#1f3a5f;--line:#d5dbe3;--bg:#f3f5f8;--text:#1d2530;--muted:#6b7684;--accent:#2f6fd6;--danger:#c8382e;--ok:#1f8a4c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;font-size:17px}
header{position:sticky;top:0;z-index:10;background:#7a2b1f;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 18px) 12px calc(env(safe-area-inset-left) + 18px);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:19px;margin:0;flex:1;font-weight:600;letter-spacing:.05em;white-space:nowrap}
header button,header a{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:15px;text-decoration:none;font-family:inherit}
main{max-width:860px;margin:0 auto;padding:16px calc(env(safe-area-inset-right) + 16px) 120px calc(env(safe-area-inset-left) + 16px)}
section{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
section h2{font-size:14px;color:var(--muted);margin:0 0 12px;font-weight:600;letter-spacing:.08em}
.grid{display:grid;gap:12px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input,select{font:inherit;font-size:17px;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;width:100%;min-height:48px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#8893a2 50%),linear-gradient(135deg,#8893a2 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 12px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.free{margin-top:8px}.hidden{display:none!important}
.checks{display:grid;gap:8px}
.chk{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;font:inherit;font-size:16px;color:var(--text);text-align:left;width:100%}
.chk .box{width:30px;height:30px;border:2px solid #9aa5b4;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#fff}
.chk.on{border-color:var(--ok);background:#eef8f2}
.chk.on .box{background:var(--ok);border-color:var(--ok)}
.chk.on .box::after{content:"✓"}
.allbtn{margin-top:10px}
.hw{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hwitem{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;display:flex;flex-direction:column;gap:8px;font:inherit;text-align:left;color:var(--text)}
.hwitem b{font-size:15px}
.hwitem .th{height:90px;border:1px dashed #b7c0cc;border-radius:8px;background:#fafbfd;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;overflow:hidden}
.hwitem .th img{max-width:96%;max-height:92%}
.hwitem .st{font-size:13px;color:var(--accent)}
.btn{font:inherit;border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:600;background:#e8edf4;color:var(--navy)}
.btn.primary{background:var(--accent);color:#fff}.btn.danger{background:#fbe9e7;color:var(--danger)}
.btn.small{padding:9px 14px;font-size:14px;font-weight:500}.btn:active{opacity:.7}.btn:disabled{opacity:.5}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px);display:flex;gap:12px;justify-content:center;z-index:10}
.overlay{position:fixed;inset:0;background:rgba(15,22,32,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.panel{background:#fff;border-radius:16px;width:min(1100px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.panel-head h3{margin:0;font-size:17px;flex:1}
.panel-body{padding:14px 18px;overflow:auto}
.panel-foot{padding:12px 18px calc(env(safe-area-inset-bottom) + 12px);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#padOverlay{z-index:60;align-items:flex-end;padding:0;background:rgba(15,22,32,.2)}
#padOverlay .panel{border-radius:18px 18px 0 0;width:100%;max-height:none;box-shadow:0 -6px 24px rgba(0,0,0,.18)}
#padWrap{position:relative;margin:0 auto;border:2px dashed #b7c0cc;border-radius:12px;background:#fff;overflow:hidden}
#padWrap.rows4{background:linear-gradient(#b9c4d3,#b9c4d3) 0 25%/100% 2px no-repeat,linear-gradient(#b9c4d3,#b9c4d3) 0 50%/100% 2px no-repeat,linear-gradient(#b9c4d3,#b9c4d3) 0 75%/100% 2px no-repeat,#fff}
#padCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.padhint{font-size:13px;color:var(--muted);margin-bottom:8px}
.pvwrap{position:relative}
#pvCanvas{width:100%;height:auto;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.08);background:#fff;display:block}
.hit{position:absolute;border:2px solid var(--accent);border-radius:5px;background:rgba(47,111,214,.08);color:var(--accent);font-weight:700;font-size:clamp(8px,1.4vw,14px);display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
.hit.done{background:transparent;border-style:dashed;color:transparent}
.warn{background:#fff6e0;color:#8a5a00;border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.list{list-style:none;margin:0 0 10px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}.list li span{flex:1}
.list li button{border:0;background:#eef2f7;border-radius:8px;width:40px;height:38px;font-size:16px;color:var(--navy)}
.list li button.del{background:#fbe9e7;color:var(--danger);width:auto;padding:0 12px;font-size:14px}
.addrow{display:flex;gap:8px;margin-bottom:6px}.addrow input{flex:1}
.lh{font-size:14px;color:var(--muted);margin:18px 0 8px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#1d2530;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (max-width:640px){.g3,.g2,.hw{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>危険予知活動表</h1>
  <a href="index.html">出張報告へ</a>
  <button id="btnNew" type="button">新規</button>
  <button id="btnSettings" type="button">リスト設定</button>
</header>

<main id="form">
  <section>
    <h2>日付・天候・作業内容</h2>
    <div class="grid g2">
      <label class="f">日付<input id="date" type="date"></label>
      <label class="f">天候<select id="weather"></select></label>
    </div>
    <div style="margin-top:12px">
      <label class="f">グループの作業内容
        <select id="workSel"></select>
        <input id="workFree" class="free hidden" placeholder="作業内容を入力" autocomplete="off">
      </label>
    </div>
  </section>

  <section>
    <h2>会社・グループ・人数</h2>
    <div class="grid g2">
      <label class="f">会社名<select id="companySel"></select><input id="companyFree" class="free hidden" placeholder="会社名を入力" autocomplete="off"></label>
      <label class="f">グループ<select id="groupSel"></select><input id="groupFree" class="free hidden" placeholder="グループを入力" autocomplete="off"></label>
      <label class="f">リーダー<select id="leaderSel"></select><input id="leaderFree" class="free hidden" placeholder="リーダーを入力" autocomplete="off"></label>
      <label class="f">作業員<select id="workers"></select></label>
    </div>
  </section>

  <section>
    <h2>確認項目（タップでチェック）</h2>
    <div class="checks" id="checks"></div>
    <button class="btn small allbtn" id="btnAllChk" type="button">すべてチェック</button>
  </section>

  <section>
    <h2>手書き欄（タップして書く）</h2>
    <div class="hw" id="hwList"></div>
  </section>
</main>

<div class="bar"><button class="btn primary" id="btnPreview" type="button">確認してPDFを作成</button></div>

<div class="overlay hidden" id="padOverlay">
  <div class="panel">
    <div class="panel-head"><h3 id="padTitle"></h3></div>
    <div class="panel-body">
      <div class="padhint" id="padHint"></div>
      <div id="padWrap"><canvas id="padCanvas"></canvas></div>
    </div>
    <div class="panel-foot">
      <button class="btn" id="padUndo" type="button">1つ戻す</button>
      <button class="btn danger" id="padClear" type="button">全部消す</button>
      <button class="btn" id="padCancel" type="button">キャンセル</button>
      <button class="btn primary" id="padOk" type="button">決定</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="pvOverlay">
  <div class="panel">
    <div class="panel-head"><h3>内容の確認</h3><span id="pvName" style="font-size:13px;color:var(--muted)"></span></div>
    <div class="panel-body">
      <div id="pvWarn"></div>
      <div class="pvwrap" id="pvWrap"><canvas id="pvCanvas"></canvas></div>
    </div>
    <div class="panel-foot">
      <button class="btn" id="pvBack" type="button">戻って修正</button>
      <button class="btn" id="pvDl" type="button" disabled>この端末に保存</button>
      <button class="btn primary" id="pvSave" type="button" disabled>共有して保存（Dropboxなど）</button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="setOverlay">
  <div class="panel" style="width:min(620px,100%)">
    <div class="panel-head"><h3>リスト設定</h3></div>
    <div class="panel-body" id="setBody"></div>
    <div class="panel-foot"><button class="btn primary" id="setClose" type="button">閉じる</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

function collect(){var d={};FIELDS.forEach(function(f){d[f]=$(f).value});d.checks=checks.slice();d.ink=JSON.parse(JSON.stringify(ink));return d}
function restore(d){
  FIELDS.forEach(function(f){$(f).value=''});
  ['date','weather','workers'].forEach(function(f){if(d[f]!=null)$(f).value=d[f]});
  LISTDEF.forEach(function(L){var v=d[L.sel];
    if(v&&v!==FREE&&lists[L.k].indexOf(v)<0){$(L.sel).value=FREE;$(L.free).value=v}else{$(L.sel).value=v||'';$(L.free).value=d[L.free]||''}});
  checks=(d.checks||[]).concat([false,false,false,false,false]).slice(0,5);
  ink=d.ink||{};
  syncFree();renderChecks();renderHwThumbs();
}
function blank(){return{date:today(),checks:[],ink:{}}}

var pad=$('padCanvas'),pctx=pad.getContext('2d'),cur=null,strokes=[],drawing=false,last=null,lastMid=null,padW=0,padH=0;
function hwDef(k){for(var i=0;i<HW.length;i++)if(HW[i].k===k)return HW[i]}
function openPad(k){
  var h=hwDef(k);cur=h;
  var pb=document.querySelector('#pvOverlay .panel-body');if(pb)pb.scrollTop=0;
  $('padTitle').textContent=h.t;$('padHint').textContent=h.hint;
  var asp=h.rows4?h.w/h.h:h.aspect;
  $('padWrap').className=h.rows4?'rows4':'';
  var wrap=$('padWrap');
  wrap.style.width='min(100%, calc((70vh - 150px) * '+asp+'))';wrap.style.aspectRatio=asp+' / 1';
  $('padOverlay').classList.remove('hidden');
  requestAnimationFrame(function(){
    padW=1800;padH=Math.round(1800/asp);pad.width=padW;pad.height=padH;
    pctx.setTransform(1,0,0,1,0,0);pctx.clearRect(0,0,padW,padH);
    pctx.lineCap='round';pctx.lineJoin='round';pctx.strokeStyle='#0b1a33';pctx.fillStyle='#0b1a33';
    strokes=[];
    if(ink[k]){var im=new Image();im.onload=function(){pctx.drawImage(im,0,0,padW,padH);strokes.push(pctx.getImageData(0,0,padW,padH))};im.src=ink[k]}
    else strokes.push(null);
  });
}
function ppt(e){var r=pad.getBoundingClientRect();var s=padW/r.width;return{x:(e.clientX-r.left)*s,y:(e.clientY-r.top)*s,p:(e.pointerType==='pen'&&e.pressure)?e.pressure:0.5}}
function lw(p){return padW/(cur&&cur.rows4?260:330)*(0.55+p*0.9)}
pad.addEventListener('pointerdown',function(e){e.preventDefault();pad.setPointerCapture(e.pointerId);drawing=true;last=ppt(e);lastMid=last;
  pctx.beginPath();pctx.arc(last.x,last.y,lw(last.p)/2,0,Math.PI*2);pctx.fill()});
pad.addEventListener('pointermove',function(e){if(!drawing)return;e.preventDefault();
  var evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];if(!evs.length)evs=[e];
  evs.forEach(function(ev){var p=ppt(ev),mid={x:(last.x+p.x)/2,y:(last.y+p.y)/2};
    pctx.beginPath();pctx.lineWidth=lw(p.p);pctx.moveTo(lastMid.x,lastMid.y);pctx.quadraticCurveTo(last.x,last.y,mid.x,mid.y);pctx.stroke();last=p;lastMid=mid})});
function endStroke(){if(!drawing)return;drawing=false;pctx.beginPath();pctx.moveTo(lastMid.x,lastMid.y);pctx.lineTo(last.x,last.y);pctx.stroke();
  strokes.push(pctx.getImageData(0,0,padW,padH));if(strokes.length>30)strokes.splice(1,1)}
pad.addEventListener('pointerup',endStroke);pad.addEventListener('pointercancel',endStroke);
$('padUndo').onclick=function(){if(strokes.length<=1){toast('これ以上戻せません');return}strokes.pop();var s=strokes[strokes.length-1];pctx.clearRect(0,0,padW,padH);if(s)pctx.putImageData(s,0,0)};
$('padClear').onclick=function(){pctx.clearRect(0,0,padW,padH);strokes.push(null)};
$('padCancel').onclick=function(){$('padOverlay').classList.add('hidden')};
function isEmpty(){var d=pctx.getImageData(0,0,padW,padH).data;for(var i=3;i<d.length;i+=16)if(d[i]>10)return false;return true}
$('padOk').onclick=function(){
  if(isEmpty())delete ink[cur.k];else ink[cur.k]=pad.toDataURL('image/png');
  $('padOverlay').classList.add('hidden');renderHwThumbs();saveDraft();
  if(!$('pvOverlay').classList.contains('hidden'))buildPreview();
};

var PW=841.89,PH=595.28,IW=1287,IH=910;
var FONT='"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans CJK JP",sans-serif';
var bgImg=new Image();bgImg.src=BG_SRC;
function loadImg(src){return new Promise(function(res){var im=new Image();im.onload=function(){res(im)};im.onerror=function(){res(null)};im.src=src})}
function trimmed(im){
  var c=document.createElement('canvas');c.width=im.width;c.height=im.height;var x=c.getContext('2d');x.drawImage(im,0,0);
  var d=x.getImageData(0,0,c.width,c.height).data,w=c.width,h=c.height,x0=w,y0=h,x1=-1,y1=-1;
  for(var y=0;y<h;y+=2)for(var xx=0;xx<w;xx+=2)if(d[(y*w+xx)*4+3]>10){if(xx<x0)x0=xx;if(xx>x1)x1=xx;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)return null;var p=6;x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(w-1,x1+p);y1=Math.min(h-1,y1+p);
  return{im:im,sx:x0,sy:y0,sw:x1-x0+1,sh:y1-y0+1};
}
function drawForm(ctx,d,imgs){
  ctx.fillStyle='#fff';ctx.fillRect(0,0,IW,IH);
  if(bgImg.complete&&bgImg.naturalWidth)ctx.drawImage(bgImg,0,0,IW,IH);
  ctx.fillStyle='#000';ctx.strokeStyle='#000';
  function t(s,x,y,sz,align,weight){if(s==null||s==='')return;ctx.font=(weight||'500')+' '+sz+'px '+FONT;ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(String(s),x,y)}
  function fit(s,x,y,maxw,sz,align,weight){if(!s)return;var z=sz;ctx.font=(weight||'500')+' '+z+'px '+FONT;while(z>10&&ctx.measureText(s).width>maxw){z-=1;ctx.font=(weight||'500')+' '+z+'px '+FONT}t(s,x,y,z,align,weight)}
  // 日付
  if(d.date){var a=d.date.split('-'),dt=new Date(+a[0],+a[1]-1,+a[2]);
    t(String(+a[1]),690,100,52,'center','700');t(String(+a[2]),806,100,52,'center','700');
    t('日月火水木金土'.charAt(dt.getDay()),975,104,40,'center','700')}
  fit(d.weather,1108,102,118,26,'left','700');
  fit(pick(LISTDEF[0],d),345,171,860,28,'left');
  // チェック
  ctx.lineCap='round';ctx.lineJoin='round';
  (d.checks||[]).forEach(function(on,i){if(!on)return;var c=CHECKS[i];
    ctx.beginPath();ctx.lineWidth=4.5;ctx.moveTo(c.x+3,c.y+11);ctx.lineTo(c.x+10,c.y+20);ctx.lineTo(c.x+27,c.y-6);ctx.stroke()});
  // 会社・グループ・リーダー・人数
  fit(pick(LISTDEF[1],d),360,736,385,26);
  fit(pick(LISTDEF[2],d),760,745,370,24);
  fit(pick(LISTDEF[3],d),1092,745,240,24);
  if(d.workers)t(d.workers,1130,802,34,'center','700');
  // 手書き
  HW.forEach(function(h){var im=imgs[h.k];if(!im)return;
    if(!h.trim){ctx.drawImage(im,h.x,h.y,h.w,h.h);return}
    var tr=trimmed(im);if(!tr)return;
    var bw=h.w-12,bh=h.h-8,s=Math.min(bw/tr.sw,bh/tr.sh);
    ctx.drawImage(im,tr.sx,tr.sy,tr.sw,tr.sh,h.x+6,h.y+4+(bh-tr.sh*s)/2,tr.sw*s,tr.sh*s)});
}

/* ---------- PDF ---------- */
function makePdf(jpg,w,h){
  var enc=new TextEncoder(),parts=[],len=0,offs=[];
  function push(x){var b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length}
  function obj(n,s){offs[n]=len;push(n+' 0 obj\n'+s+'\nendobj\n')}
  push('%PDF-1.4\n');push(new Uint8Array([37,226,227,207,211,10]));
  obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
  obj(3,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+PW+' '+PH+']/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>');
  offs[4]=len;push('4 0 obj\n<</Type/XObject/Subtype/Image/Width '+w+'/Height '+h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpg.length+'>>\nstream\n');push(jpg);push('\nendstream\nendobj\n');
  var cs='q '+PW+' 0 0 '+PH+' 0 0 cm /Im0 Do Q';obj(5,'<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream');
  var xref=len,x='xref\n0 6\n0000000000 65535 f \n';for(var i=1;i<=5;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n'+xref+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'});
}
var pdfBlob=null,pdfName='';
function buildPreview(){
  var d=collect(),warns=[];
  if(!d.ink.danger)warns.push('「危険のポイント」が未記入です');
  if(!d.ink.sign)warns.push('参加者サインがまだです');
  if(!d.checks.every(Boolean))warns.push('チェックしていない確認項目があります');
  $('pvWarn').innerHTML=warns.length?'<div class="warn">'+warns.map(esc).join('<br>')+'<br>手書き欄は下の帳票を直接タップしても書けます。</div>':'';
  pdfBlob=null;$('pvSave').disabled=true;$('pvDl').disabled=true;$('pvSave').textContent='PDFを作成中…';
  var dt=d.date||today();pdfName=(dt+'_危険予知活動表'+(pick(LISTDEF[1],d)?'_'+pick(LISTDEF[1],d):'')+'.pdf').replace(/[\\\/:*?"<>|]/g,'_');
  $('pvName').textContent=pdfName;$('pvOverlay').classList.remove('hidden');
  // 手書き欄のタップ領域
  var wrap=$('pvWrap');Array.prototype.forEach.call(wrap.querySelectorAll('.hit'),function(n){n.remove()});
  HW.forEach(function(h){var b=document.createElement('button');b.type='button';b.className='hit'+(d.ink[h.k]?' done':'');
    b.style.left=(h.x/IW*100)+'%';b.style.top=(h.y/IH*100)+'%';b.style.width=(h.w/IW*100)+'%';b.style.height=(h.h/IH*100)+'%';
    b.textContent=d.ink[h.k]?'':'タップして書く';b.onclick=function(){openPad(h.k)};wrap.appendChild(b)});
  var ks=HW.map(function(h){return h.k});
  Promise.all(ks.map(function(k){return d.ink[k]?loadImg(d.ink[k]):Promise.resolve(null)})).then(function(arr){
    var imgs={};ks.forEach(function(k,i){imgs[k]=arr[i]});
    var go=function(){
      var W=3508,H=2480,c=$('pvCanvas');c.width=W;c.height=H;var ctx=c.getContext('2d');
      ctx.setTransform(W/IW,0,0,H/IH,0,0);drawForm(ctx,d,imgs);
      c.toBlob(function(b){b.arrayBuffer().then(function(buf){pdfBlob=makePdf(new Uint8Array(buf),W,H);
        $('pvSave').disabled=false;$('pvDl').disabled=false;$('pvSave').textContent='共有して保存（Dropboxなど）'})},'image/jpeg',0.9);
    };
    if(bgImg.complete&&bgImg.naturalWidth)go();else bgImg.onload=go;
  });
}
$('btnPreview').onclick=buildPreview;
$('pvBack').onclick=function(){$('pvOverlay').classList.add('hidden')};
$('pvSave').onclick=function(){
  if(!pdfBlob)return;var file=null;try{file=new File([pdfBlob],pdfName,{type:'application/pdf'})}catch(e){}
  if(!(file&&navigator.canShare&&navigator.canShare({files:[file]}))){toast('このブラウザは共有に対応していません。「この端末に保存」を使ってください');return}
  navigator.share({files:[file],title:pdfName}).then(function(){toast('保存・共有しました')}).catch(function(e){if(e&&e.name==='AbortError')return;toast('共有できませんでした（'+(e&&e.name||'不明')+'）。「この端末に保存」を使ってください')});
};
$('pvDl').onclick=function(){
  if(!pdfBlob)return;
  if(window.showSaveFilePicker){window.showSaveFilePicker({suggestedName:pdfName,types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]})
    .then(function(h){return h.createWritable().then(function(w){return w.write(pdfBlob).then(function(){return w.close()})})}).then(function(){toast('保存しました')})
    .catch(function(e){if(e&&e.name==='AbortError')return;fb()})}else fb();
  function fb(){var url=URL.createObjectURL(pdfBlob),a=document.createElement('a');a.href=url;a.download=pdfName;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},300000);toast('「ダウンロード」フォルダに保存しました')}
};

/* ---------- リスト設定 ---------- */
function renderSettings(){
  $('setBody').innerHTML=LISTDEF.map(function(L,li){
    var items=lists[L.k];
    return '<div class="lh"'+(li===0?' style="margin-top:0"':'')+'>'+L.label+'</div><ul class="list">'+
      (items.length?items.map(function(v,i){return '<li><span>'+esc(v)+'</span><button data-k="'+L.k+'" data-a="up" data-i="'+i+'">↑</button><button data-k="'+L.k+'" data-a="down" data-i="'+i+'">↓</button><button class="del" data-k="'+L.k+'" data-a="del" data-i="'+i+'">削除</button></li>'}).join(''):'<li><span style="color:var(--muted)">まだありません</span></li>')+
      '</ul><div class="addrow"><input id="add_'+L.k+'" placeholder="'+L.label+'を追加"><button class="btn" data-k="'+L.k+'" data-a="add" type="button">追加</button></div>';
  }).join('')+'<p style="font-size:13px;color:var(--muted)">↑↓で並び順を変えられます。リストはこの端末に保存されます。</p>';
}
function listChanged(){store(LS_LISTS,lists);var d=collect();refreshSelects();restore(d);renderSettings()}
$('setBody').addEventListener('click',function(e){
  var b=e.target.closest('button[data-a]');if(!b)return;var k=b.dataset.k,a=b.dataset.a,arr=lists[k],i=+b.dataset.i;
  if(a==='add'){var inp=$('add_'+k),v=inp.value.trim();if(!v)return;if(arr.indexOf(v)>=0){toast('すでにリストにあります');return}arr.push(v);toast('「'+v+'」を追加しました')}
  else if(a==='up'&&i>0){var t1=arr[i-1];arr[i-1]=arr[i];arr[i]=t1}
  else if(a==='down'&&i<arr.length-1){var t2=arr[i+1];arr[i+1]=arr[i];arr[i]=t2}
  else if(a==='del'){if(!window.confirm('「'+arr[i]+'」をリストから削除しますか？'))return;arr.splice(i,1)}
  listChanged();
});
$('setBody').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id&&e.target.id.indexOf('add_')===0){var b=e.target.parentNode.querySelector('button');if(b)b.click()}});
$('btnSettings').onclick=function(){renderSettings();$('setOverlay').classList.remove('hidden')};
$('setClose').onclick=function(){$('setOverlay').classList.add('hidden')};

/* ---------- 起動 ---------- */
var draft=load(LS_DRAFT,null);restore(draft||blank());if(!draft)saveDraft();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
